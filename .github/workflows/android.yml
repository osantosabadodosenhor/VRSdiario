name: Compilar Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # PASSO ADICIONADO: Garante que o GitHub tem permissão para rodar o Gradle do seu projeto
      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x gradlew

      # PASSO CORRIGIDO: Mudança de 'gradle' para './gradlew'
      - name: Compilar APK
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: vrsdiario
          # PASSO OTIMIZADO: O uso do '*' captura o APK mesmo se o nome final variar
          path: app/build/outputs/apk/debug/*.apk
